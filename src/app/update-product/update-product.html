<div class="container">
  <h2>Edit Product (PUT Request)</h2>

  <div class="select-box">
    <label>Select Product to Update:</label>
    <select [(ngModel)]="selectedId" (change)="onSelectProduct()" class="form-control">
      <option *ngFor="let p of productList" [value]="p.id">
        #{{ p.id }} - {{ p.title }} (${{ p.price }})
      </option>
    </select>
  </div>

  <div *ngIf="product" class="form-wrapper">
    <form (ngSubmit)="onUpdate()">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" [(ngModel)]="product.title" class="form-control" required />
      </div>

      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" name="price" [(ngModel)]="product.price" class="form-control" required />
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" [(ngModel)]="product.category" class="form-control" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" [(ngModel)]="product.description" class="form-control" rows="3"></textarea>
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-warning">
        {{ loading ? 'Saving...' : 'Save Changes (PUT)' }}
      </button>
    </form>
  </div>

  <p class="success" *ngIf="successMsg">{{ successMsg }}</p>
  <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
</div>
