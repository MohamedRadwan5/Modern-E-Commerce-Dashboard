<div class="app-layout">
  <!-- TOP NAVIGATION BAR -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="logo-icon">🛍️</span>
      <span class="logo-text"> E-Commerce </span>
    </div>
    <div class="nav-links">
      <button class="nav-btn" [class.active]="activeTab === 'dashboard'" (click)="setActiveTab('dashboard')">
        📊 Admin Dashboard
      </button>
      <button class="nav-btn" [class.active]="activeTab === 'list'" (click)="setActiveTab('list')">
        📋 Product List (GET & DELETE)
      </button>
      <button class="nav-btn" [class.active]="activeTab === 'add'" (click)="setActiveTab('add')">
        ➕ Add Product (POST)
      </button>
      <button class="nav-btn" [class.active]="activeTab === 'update'" (click)="setActiveTab('update')">
        ✏️ Edit Product (PUT)
      </button>
      <button class="nav-btn" [class.active]="activeTab === 'names'" (click)="setActiveTab('names')">
        🏷️ Product Titles
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT AREA BASED ON ACTIVE TAB -->
  <main class="main-content">
    <!-- TAB 1: ALL-IN-ONE DASHBOARD -->
    <div *ngIf="activeTab === 'dashboard'">
      <app-dashboard></app-dashboard>
    </div>

    <!-- TAB 2: PRODUCT LIST COMPONENT -->
    <div *ngIf="activeTab === 'list'" class="tab-wrapper">
      <app-product-list></app-product-list>
    </div>

    <!-- TAB 3: ADD PRODUCT COMPONENT -->
    <div *ngIf="activeTab === 'add'" class="tab-wrapper">
      <app-add-product></app-add-product>
    </div>

    <!-- TAB 4: UPDATE PRODUCT COMPONENT -->
    <div *ngIf="activeTab === 'update'" class="tab-wrapper">
      <app-update-product></app-update-product>
    </div>

    <!-- TAB 5: PRODUCT NAMES COMPONENT -->
    <div *ngIf="activeTab === 'names'" class="tab-wrapper">
      <app-product-names></app-product-names>
    </div>
  </main>
</div>
